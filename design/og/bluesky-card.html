  const n = parties.reduce((s, [, k]) => s + k, 0), inner = 0.42;
  const capacity = (k) => { const gap = (1 - inner) / k; return Array.from({ length: k }, (_, i) => Math.floor((Math.PI * (inner + gap * (i + 0.5))) / gap)); };
  let rows = 1; while (capacity(rows).reduce((a, b) => a + b, 0) < n) rows++;
  const caps = capacity(rows), total = caps.reduce((a, b) => a + b, 0);
  const counts = caps.map((c) => Math.floor((c / total) * n));
  for (let i = rows - 1; counts.reduce((a, b) => a + b, 0) < n; i = (i - 1 + rows) % rows) counts[i]++;
  const gap = (1 - inner) / rows;
  const seats = counts.flatMap((count, row) => { const r = inner + gap * (row + 0.5); return Array.from({ length: count }, (_, j) => { const a = Math.PI - (Math.PI * j) / (count - 1); return { x: r * Math.cos(a), y: -r * Math.sin(a), a, row }; }); });
  seats.sort((p, q) => q.a - p.a || q.row - p.row);
  const fills = parties.flatMap(([c, k]) => Array(k).fill(c));
  document.getElementById("seats").innerHTML = seats.map((s, i) => `<circle cx="${s.x}" cy="${s.y}" r="${gap * 0.4}" fill="${fills[i]}"/>`).join("");
</script>
</body></html>
